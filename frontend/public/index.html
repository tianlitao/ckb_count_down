<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nervos CKB - Hash Lottery (With Claim)</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ckb-green: #00cc9b;
            --ckb-gold: #ffd700; /* 新增金色用于中奖状态 */
            --ckb-dark: #050505;
            --neon-glow: 0 0 10px rgba(0, 204, 155, 0.5), 0 0 20px rgba(0, 204, 155, 0.3);
            --gold-glow: 0 0 10px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.3);
            --fail-red: #ff3366;
            --panel-bg: rgba(20, 20, 20, 0.6);
            --border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--ckb-dark);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image:
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* 背景动画 */
        .bg-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 204, 155, 0.1) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse 5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* 顶部导航 */
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--ckb-green);
            text-shadow: var(--neon-glow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: #fff; font-size: 14px; font-weight: 400; opacity: 0.7; margin-left: 10px; border-left: 1px solid #555; padding-left: 10px;}

        .wallet-btn {
            background: rgba(0, 204, 155, 0.1);
            border: 1px solid var(--ckb-green);
            color: var(--ckb-green);
            padding: 8px 20px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        .wallet-btn:hover {
            background: var(--ckb-green);
            color: #000;
            box-shadow: var(--neon-glow);
        }

        /* 主容器 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px; /* 稍微紧凑一点 */
            position: relative;
            width: 100%;
            max-width: 800px;
        }

        /* 待领取面板 (新增核心部分) */
        .claim-panel {
            width: 100%;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--ckb-gold);
            border-radius: 4px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--gold-glow);
            transform: translateY(-20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            top: -80px; /* 位于哈希显示区上方 */
            z-index: 20;
        }

        .claim-panel.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .claim-info {
            display: flex;
            flex-direction: column;
        }

        .claim-label {
            font-size: 12px;
            color: var(--ckb-gold);
            letter-spacing: 1px;
        }

        .claim-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: #fff;
            font-weight: bold;
        }

        .claim-btn {
            background: var(--ckb-gold);
            color: #000;
            border: none;
            padding: 10px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: transform 0.2s;
            animation: btnPulse 2s infinite;
        }

        .claim-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--ckb-gold);
        }

        .claim-btn:active {
            transform: scale(0.95);
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }


        /* 哈希显示区 */
        .hash-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .hash-char {
            display: inline-block;
            width: 40px;
            text-align: center;
            transition: color 0.2s;
        }

        .hash-char.highlight {
            color: var(--ckb-gold); /* 中奖改为金色 */
            text-shadow: 0 0 20px var(--ckb-gold);
            font-size: 64px;
        }

        .hash-char.fail {
            color: var(--fail-red);
            text-shadow: 0 0 20px var(--fail-red);
            font-size: 64px;
        }

        .status-text {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: -20px;
            height: 20px;
        }

        /* 控制面板 */
        .control-panel {
            background: var(--panel-bg);
            border: var(--border);
            padding: 30px;
            border-radius: 4px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .control-panel::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 4px;
            background: linear-gradient(45deg, transparent, rgba(0, 204, 155, 0.3), transparent);
            z-index: -1;
            opacity: 0.5;
        }

        /* 输入区域 */
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-family: 'JetBrains Mono', monospace;
            width: 150px;
            outline: none;
        }

        .input-group label {
            color: #888;
            font-size: 12px;
        }

        .ckb-unit {
            color: var(--ckb-green);
            font-weight: bold;
        }

        /* 下注按钮 */
        .bet-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .bet-btn {
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .bet-btn span {
            display: block;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            font-family: 'JetBrains Mono', monospace;
        }

        .bet-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }

        .bet-btn.low:active, .bet-btn.low.selected {
            background: linear-gradient(90deg, rgba(0, 204, 255, 0.2), transparent);
            border-color: #00ccff;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.2);
        }

        .bet-btn.high:active, .bet-btn.high.selected {
            background: linear-gradient(90deg, transparent, rgba(255, 0, 204, 0.2));
            border-color: #ff00cc;
            box-shadow: 0 0 15px rgba(255, 0, 204, 0.2);
        }

        /* 历史记录 */
        .history {
            width: 100%;
            max-width: 800px;
            border-top: var(--border);
            padding-top: 20px;
        }

        .history-title {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 8px 15px;
            background: rgba(255,255,255,0.03);
            border-left: 2px solid #333;
            animation: slideIn 0.3s ease-out;
            align-items: center;
        }

        .history-item.win { border-left-color: var(--ckb-gold); }
        .history-item.loss { border-left-color: var(--fail-red); }

        .history-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 2px;
            margin-left: 8px;
        }
        .tag-pending { background: #555; color: #aaa; }
        .tag-claimed { background: var(--ckb-gold); color: #000; font-weight: bold; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 弹窗/加载 */
        .loader {
            width: 100%;
            height: 4px;
            background: #111;
            position: relative;
            overflow: hidden;
            display: none;
        }

        .loader.active { display: block; }

        .loader::after {
            content: '';
            position: absolute;
            left: -50%;
            width: 50%;
            height: 100%;
            background: var(--ckb-green);
            animation: loading 1s linear infinite;
        }

        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        .result-msg {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            top: 30%;
        }

        .result-msg.show {
            opacity: 1;
            transform: scale(1);
        }

        .win-text { color: var(--ckb-gold); text-shadow: 0 0 30px var(--ckb-gold); }
        .lose-text { color: var(--fail-red); text-shadow: 0 0 30px var(--fail-red); }

    </style>
</head>
<body>

    <div class="bg-orb"></div>

    <header>
        <div class="logo">
            NERVOS <span>HASH LOTTERY</span>
        </div>
        <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
    </header>

    <div class="main-container">

        <!-- 新增：待领取面板 -->
        <div id="claimPanel" class="claim-panel">
            <div class="claim-info">
                <span class="claim-label">UNCLAIMED WINNINGS</span>
                <span class="claim-amount" id="claimAmount">0 CKB</span>
            </div>
            <button class="claim-btn" onclick="claimWinnings()">CLAIM NOW</button>
        </div>

        <!-- 结果动画层 -->
        <div id="winMsg" class="result-msg win-text">YOU WON</div>
        <div id="loseMsg" class="result-msg lose-text">YOU LOST</div>

        <div class="hash-display" id="hashDisplay">
            <span class="hash-char">?</span>
            <span class="hash-char">?</span>
            <span class="hash-char">?</span>
            <span class="hash-char">?</span>
            <span class="hash-char" style="opacity: 0.5">.</span>
            <span class="hash-char">?</span>
            <span class="hash-char">?</span>
            <span class="hash-char" id="targetChar">?</span>
        </div>

        <div class="status-text" id="statusText">WAITING FOR NEXT BLOCK...</div>

        <div class="control-panel">
            <div class="loader" id="loader"></div>

            <div class="input-group">
                <div>
                    <label>BET AMOUNT</label>
                    <br>
                    <input type="number" value="100" id="betAmount" min="62">
                </div>
                <div class="ckb-unit">CKB</div>
            </div>

            <div class="bet-actions">
                <button class="bet-btn low" onclick="placeBet('low')">
                    SMALL
                    <span>0 - 7</span>
                </button>
                <button class="bet-btn high" onclick="placeBet('high')">
                    BIG
                    <span>8 - F</span>
                </button>
            </div>
        </div>

        <div class="history">
            <div class="history-title">
                <span>RECENT TRANSACTIONS</span>
                <span>Live on CKB Testnet</span>
            </div>
            <div class="history-list" id="historyList">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 模拟状态
        let isConnected = false;
        let balance = 10500;
        let pendingWinnings = 0; // 待领取的金额
        let isBetting = false;

        const statusText = document.getElementById('statusText');
        const hashDisplay = document.getElementById('hashDisplay');
        const targetChar = document.getElementById('targetChar');
        const walletBtn = document.getElementById('walletBtn');
        const loader = document.getElementById('loader');
        const historyList = document.getElementById('historyList');
        const betAmountInput = document.getElementById('betAmount');
        const claimPanel = document.getElementById('claimPanel');
        const claimAmountEl = document.getElementById('claimAmount');

        // 随机哈希生成动画
        let scrambleInterval;
        const hexChars = '0123456789ABCDEF';

        function startScramble() {
            clearInterval(scrambleInterval);
            scrambleInterval = setInterval(() => {
                const spans = hashDisplay.querySelectorAll('.hash-char:not(#targetChar)');
                spans.forEach(span => {
                    if(span.innerText !== '.')
                        span.innerText = hexChars[Math.floor(Math.random() * 16)];
                });
                targetChar.innerText = hexChars[Math.floor(Math.random() * 16)];
            }, 50);
        }

        function stopScramble(finalChar) {
            clearInterval(scrambleInterval);
            targetChar.innerText = finalChar;
            // 补全其他假数据
            const spans = hashDisplay.querySelectorAll('.hash-char:not(#targetChar)');
            spans.forEach(span => {
                if(span.innerText !== '.')
                    span.innerText = hexChars[Math.floor(Math.random() * 16)];
            });
        }

        // 初始状态：慢速滚动
        startScramble();

        // 钱包连接
        function connectWallet() {
            if (isConnected) return;
            walletBtn.innerText = "CONNECTING...";
            setTimeout(() => {
                isConnected = true;
                updateWalletUI();
                walletBtn.style.background = "var(--ckb-green)";
                walletBtn.style.color = "#000";
            }, 1000);
        }

        function updateWalletUI() {
            walletBtn.innerText = `ckb1...9a2f | ${balance.toLocaleString()} CKB`;
        }

        // 下注逻辑
        function placeBet(type) {
            if (!isConnected) {
                alert("Please connect CKB wallet first!");
                return;
            }
            if (isBetting) return;

            const amount = parseInt(betAmountInput.value);
            if (amount > balance) {
                alert("Insufficient balance!");
                return;
            }

            isBetting = true;
            balance -= amount;
            updateWalletUI();

            // UI 更新
            loader.classList.add('active');
            statusText.innerText = "TX PENDING... WAITING FOR BLOCK";
            targetChar.classList.remove('highlight', 'fail');

            // 加速滚动模拟等待区块
            const fastScramble = setInterval(() => {
                targetChar.innerText = hexChars[Math.floor(Math.random() * 16)];
            }, 30);

            // 模拟2秒后出块
            setTimeout(() => {
                clearInterval(fastScramble);
                loader.classList.remove('active');

                // 生成结果
                const resultVal = Math.floor(Math.random() * 16);
                const resultHex = resultVal.toString(16).toUpperCase();

                stopScramble(resultHex);

                // 判定输赢
                let won = false;
                if (type === 'low' && resultVal <= 7) won = true;
                if (type === 'high' && resultVal >= 8) won = true;

                // 结算处理
                handleResult(won, resultHex, type, amount);

                isBetting = false;
                statusText.innerText = "WAITING FOR NEXT BET...";

                // 恢复慢速滚动
                setTimeout(startScramble, 4000);

            }, 2000);
        }

        function handleResult(won, hex, type, amount) {
            const targetEl = document.getElementById('targetChar');

            if (won) {
                targetEl.classList.add('highlight');
                const profit = Math.floor(amount * 1.95);

                // 赢了：增加待领取金额，显示领取按钮
                pendingWinnings += profit;
                showClaimPanel();

                showFloatingMsg('winMsg');
                addHistory(true, amount, hex, false); // false 表示未领取
            } else {
                targetEl.classList.add('fail');
                showFloatingMsg('loseMsg');
                addHistory(false, amount, hex, true); // 输了不需要领取
            }
        }

        // 新增：领取逻辑
        function claimWinnings() {
            if(pendingWinnings <= 0) return;

            const btn = claimPanel.querySelector('.claim-btn');
            const originalText = btn.innerText;
            btn.innerText = "CLAIMING...";

            setTimeout(() => {
                balance += pendingWinnings;
                updateWalletUI();

                // 隐藏面板
                claimPanel.classList.remove('active');

                // 重置待领取
                pendingWinnings = 0;
                btn.innerText = originalText;

                // 更新历史记录状态
                updateHistoryToClaimed();

                alert("Success! Winnings claimed to wallet.");

            }, 800);
        }

        function showClaimPanel() {
            claimAmountEl.innerText = `+${pendingWinnings.toLocaleString()} CKB`;
            claimPanel.classList.add('active');
        }

        function showFloatingMsg(id) {
            const el = document.getElementById(id);
            el.classList.add('show');
            setTimeout(() => {
                el.classList.remove('show');
            }, 2000);
        }

        function addHistory(won, amount, hex, claimed) {
            const item = document.createElement('div');
            item.className = `history-item ${won ? 'win' : 'loss'}`;

            let statusHtml = '';
            if (won) {
                statusHtml = claimed ?
                    `<span class="history-tag tag-claimed">CLAIMED</span>` :
                    `<span class="history-tag tag-pending">PENDING</span>`;
            }

            item.innerHTML = `
                <span>Block #...$${Math.floor(Math.random()*999)} [Hash ...$${hex}]</span>
                <div style="display:flex; align-items:center">
                    <span>${won ? '+' + Math.floor(amount * 0.95) : '-' + amount} CKB</span>
                    ${statusHtml}
                </div>
            `;
            // 给待领取的项目加个标记类，方便后面更新
            if(won && !claimed) item.classList.add('pending-item');

            historyList.insertBefore(item, historyList.firstChild);
        }

        function updateHistoryToClaimed() {
            const pendingItems = document.querySelectorAll('.pending-item');
            pendingItems.forEach(item => {
                const tag = item.querySelector('.history-tag');
                if(tag) {
                    tag.className = 'history-tag tag-claimed';
                    tag.innerText = 'CLAIMED';
                }
                item.classList.remove('pending-item');
            });
        }

    </script>
</body>
</html>
